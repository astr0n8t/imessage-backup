<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Messages Archive · Sign in</title>
{{head}}
</head>
<body class="login-body">
<main class="login-card">
  <img class="login-logo" src="/static/icons/icon-192.png" alt="">
  <h1>Messages Archive</h1>
  <p class="login-error" role="alert">{{error}}</p>
  <form method="post" action="/login">
    <label>Username<input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
