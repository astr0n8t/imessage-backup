<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Messages Archive · Verification code</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<main class="login-card">
  <h1>Two-factor authentication</h1>
  <p class="login-hint">Enter the 6-digit code from your authenticator app.</p>
  <p class="login-error" role="alert">{{error}}</p>
  <form method="post" action="/login/totp">
    <label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus></label>
    <button type="submit">Verify</button>
  </form>
  <p class="login-hint"><a href="/login">Start over</a></p>
</main>
</body>
</html>
