[package]
name = "imsg-server"
description = "Authenticated web viewer for archived iMessage/SMS snapshots"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "imsg-server"
path = "src/main.rs"

[dependencies]
imsg-core.workspace = true
imessage-database.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rpassword = "7"
toml = "0.9"
qrcode = { version = "0.14", default-features = false }
data-encoding = "2"
hmac = "0.12"
sha1 = "0.10"

[dev-dependencies]
tempfile.workspace = true
imsg-extract = { path = "../imsg-extract" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
